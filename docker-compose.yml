services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokemon_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: sqs,s3
      PERSISTENCE: 1
    volumes:
      - ./infrastructure/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/pokemon-cards;
      mc anonymous set public local/pokemon-cards;
      echo 'MinIO bucket ready';
      "

  upload-service:
    profiles: [backend]
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/pokemon_processor?sslmode=disable"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      SQS_QUEUE_URL: "http://localstack:4566/000000000000/pokemon-processing"
      S3_ENDPOINT: "localstack:4566"
      S3_ACCESS_KEY: "test"
      S3_SECRET_KEY: "test123"
      S3_USE_SSL: "false"
    volumes:
      - ./services/upload-service/:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  processing-service:
    profiles: [backend]
    build:
      context: ./services/processing-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/processing-service/:/app
      - /app/node_modules
    environment:
      POSTGRES_DSN: "postgresql://postgres:postgres@postgres:5432/pokemon_processor"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      SQS_QUEUE_URL: "http://localstack:4566/000000000000/pokemon-processing"
      SQS_DLQ_URL: "http://localstack:4566/000000000000/pokemon-processing-dlq"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "pokemon-cards"
      MINIO_USE_SSL: "false"
      PUBLIC_MINIO_URL: "http://localhost:9000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  notification-service:
    profiles: [backend]
    build: ./services/notification-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_UPLOAD_URL: "http://localhost:8080"
      NUXT_PUBLIC_NOTIFICATION_URL: "http://localhost:8081"
      NUXT_PUBLIC_STORAGE_URL: "http://localhost:9000"

volumes:
  postgres_data:
  minio_data:
  localstack_data:
